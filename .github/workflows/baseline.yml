name: Baseline

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go tests
        run: go test ./...
      - name: Contract and security boundaries
        run: python3 scripts/validate.py
      - name: Shell and Python syntax
        run: |
          bash -n deploy/dcp-wbc-lab-deploy
          python3 -m py_compile scripts/validate.py scripts/release_train.py scripts/issue_qualification_manifest.py
      - name: Diff hygiene
        run: git diff --check
